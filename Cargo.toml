[package]
name = "sshm"
version = "0.1.0"
edition = "2024"
description = "Terminal SSH connection manager — CRUD, smart sorting, connection testing"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
